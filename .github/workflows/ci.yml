name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout horizon-mod-toolkit
        uses: actions/checkout@v4
        with:
          path: horizon-mod-toolkit

      - name: Checkout horizon-inspector (path dependency)
        uses: actions/checkout@v4
        with:
          repository: CGRLabs/horizon-inspector
          path: horizon-inspector

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        working-directory: horizon-mod-toolkit
        run: cargo check --all-targets

      - name: Run cargo test
        working-directory: horizon-mod-toolkit
        run: cargo test
